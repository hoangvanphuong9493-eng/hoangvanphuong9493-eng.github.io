<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">

<title>A TUYẾN  P NGỦ · Bản vẽ 3D</title>
<style>
:root{--blue:#1f5fa8;--blue2:#2a6fc0;--ink:#17202b;--muted:#6b7684;--line:#d8dee6;--bg:#eef1f4;--orange:#f08a24;--green:#22875a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{background:var(--blue);color:#fff;padding:8px 12px calc(8px) 12px;padding-top:max(8px,env(safe-area-inset-top))}
header .co{font-weight:800;font-size:17px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:12px;opacity:.92}
header .sub b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
#stage{position:relative;flex:1;min-height:0;background:linear-gradient(#f6f7f9,#e4e8ed)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#badges{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#badges span{position:absolute;left:0;top:0;will-change:transform;background:rgba(255,255,255,.92);border:1px solid #9aa6b4;border-radius:9px;padding:0 5px;font-size:11px;font-weight:700;color:#173a63;white-space:nowrap}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(23,32,43,.82);color:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .25s}
#hint:empty{opacity:0}
#rect{position:absolute;border:2px dashed var(--orange);background:rgba(240,138,36,.12);display:none;pointer-events:none}
#measure{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;display:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#mdots{position:absolute;inset:0;pointer-events:none}
#mdots i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 0 0 1px var(--orange)}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
@media (min-width:760px){#tools{grid-template-columns:repeat(8,1fr)}}
#tools button{touch-action:manipulation;user-select:none;-webkit-user-select:none;border:0;border-radius:8px;background:var(--blue2);color:#fff;font:600 12px/1.15 inherit;font-family:inherit;padding:6px 3px;min-height:36px;cursor:pointer}
#tools button.on{background:var(--green)}
#tools button.handle{grid-column:1/-1;min-height:24px;padding:2px 0 3px;background:transparent;color:var(--blue);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tools button.handle .grip{width:38px;height:4px;border-radius:2px;background:#c3ccd7}
#app.min #tools button:not([data-quick]):not(.handle){display:none}
#app.min #tools{grid-template-columns:repeat(4,1fr)}
#tools button.off{background:#9fb3c9}
#tools button.dark{background:#26313d}
#tools button:active{filter:brightness(.9)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);display:none;flex-direction:column;z-index:5}
.sheet.open{display:flex}
.sheet .bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.sheet .bar h3{margin:0;font-size:15px;flex:1}
.sheet .bar button,.btn{touch-action:manipulation;border:1px solid var(--line);background:#f4f6f8;border-radius:8px;padding:6px 10px;font:600 13px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.sheet .body{overflow:auto;padding:8px 12px 12px}
.search{display:flex;gap:6px;margin-bottom:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #eef1f4;cursor:pointer}
.row:active{background:#f1f5fa}
.row .num{min-width:42px;text-align:center;font-weight:800;color:var(--blue);background:#eaf1fa;border-radius:7px;padding:3px 4px}
.row .t{flex:1;min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.row.hiddenpart{opacity:.5}
label.tag{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eef1f4}
label.tag input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;margin:8px 0 4px;font-size:13px}
@media (max-width:420px){.kv{grid-template-columns:auto 1fr}}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv b{color:var(--muted);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#scan.open{display:flex}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .bar{display:flex;gap:8px;padding:12px;background:#111;color:#fff;align-items:center}
#scan .bar span{flex:1}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#7a1d1d;font-weight:600}
.foot{color:var(--muted);font-size:11.5px;margin-top:8px}
</style>
</head>

<div id="app">
  <header>
    <div class="co" id="company"></div>
    <div class="sub"><b id="title"></b><span id="count"></span></div>

    <canvas id="gl"></canvas>
    <div id="badges"></div>
    <div id="mdots"></div>

    <div id="hint">Đang mở bản vẽ…</div>

        <div id="list"></div>
      </div>
    </div>
    <div class="sheet" id="sh-tags">
      <div class="bar"><h3>Layer (tag)</h3><button id="tags-all">Hiện hết</button><button data-close>Đóng</button></div>

      <div class="bar"><h3 id="info-title">Chi tiết tấm</h3><button data-close>Đóng</button></div>
      <div class="body" id="info"></div>
    </div>
  </div>
  <div id="tools">
    <button data-act="fold" class="handle" aria-expanded="true"><span class="grip"></span><span id="fold-text">Thu gọn công cụ ▾</span></button>
    <button data-act="find" data-quick>Tìm / Quét QR</button>

    <button data-act="wall" class="on">Tường</button>
    <button data-act="tags">Layer</button>
    <button data-act="region">Khoanh vùng</button>
    <button data-act="measure">Đo kích thước</button>
    <button data-act="info">Chi tiết tấm</button>
    <button data-act="ids">Số ID</button>
    <button data-act="label" class="on">Tem</button>
    <button data-act="color">Đổi màu</button>
    <button data-act="home" class="dark" data-quick>Về ban đầu</button>
  </div>
</div>

<script>var HPInflate=(function(){var module={exports:{}};
var TINF_OK = 0;
var TINF_DATA_ERROR = -3;

function Tree() {
  this.table = new Uint16Array(16);   /* table of code length counts */
  this.trans = new Uint16Array(288);  /* code -> symbol translation table */
}

function Data(source, dest) {
  this.source = source;
  this.sourceIndex = 0;
  this.tag = 0;
  this.bitcount = 0;
  
  this.dest = dest;
  this.destLen = 0;
  
  this.ltree = new Tree();  /* dynamic length/symbol tree */
  this.dtree = new Tree();  /* dynamic distance tree */
}

 * --------------------------------------------------- */

var dist_base = new Uint16Array(30);

/* special ordering of code length codes */
var clcidx = new Uint8Array([
  16, 17, 18, 0, 8, 7, 9, 6,
  10, 5, 11, 4, 12, 3, 13, 2,
  14, 1, 15
]);

$('list').addEventListener('click',e=>{const r=e.target.closest('.row');if(!r)return;const i=Number(r.dataset.i);$('q').blur();closeSheet('sh-find');select([i],{dim:true,focus:true,info:true});});

// ---------- tags & sensitivity ----------
function renderTags(){$('tags').innerHTML=(H.tags.length?H.tags.map((t,i)=>'<label class="tag"><input type="checkbox" data-t="'+i+'"'+(tagOn[i]?' checked':'')+'> '+esc(t.n)+'</label>').join(''):'<div class="foot">Model không có layer (tag) nào.</div>')+
  '<label class="tag" style="border:0;margin-top:6px">Độ nhạy xoay <input id="speed" type="range" min="0.3" max="2" step="0.1" value="'+S.speed+'" style="flex:1;width:auto;height:auto"> <span id="speed-v">'+Math.round(S.speed*100)+'%</span></label>';}
$('tags').addEventListener('change',e=>{const i=e.target.dataset.t;if(i===undefined)return;tagOn[Number(i)]=e.target.checked;refreshState();});
$('tags').addEventListener('input',e=>{if(e.target.id!=='speed')return;S.speed=Number(e.target.value);$('speed-v').textContent=Math.round(S.speed*100)+'%';store.set('speed',S.speed);});
$('tags-all').addEventListener('click',()=>{tagOn.fill(true);renderTags();refreshState();});

// ---------- sheets ----------
function openSheet(id){for(const s of document.querySelectorAll('.sheet'))s.classList.toggle('open',s.id===id);}
function closeSheet(id){$(id).classList.remove('open');}
document.querySelectorAll('[data-close]').forEach(b=>b.addEventListener('click',()=>b.closest('.sheet').classList.remove('open')));

// ---------- measure ----------
const M={pts:[]};
function surfacePoint(px,py){const i=pick(px,py);if(i<0)return null;const c=viewProj(),r=ray(px,py,c);let best=Infinity;
  for(let t=triStart[i],e=t+triCount[i];t<e;t+=3){const a=idx[t]*3,b=idx[t+1]*3,cc=idx[t+2]*3,A=[pos[a],pos[a+1],pos[a+2]],e1=sub([pos[b],pos[b+1],pos[b+2]],A),e2=sub([pos[cc],pos[cc+1],pos[cc+2]],A),p=cross(r.d,e2),det=dot(e1,p);
    if(Math.abs(det)<1e-12)continue;const inv=1/det,s=sub(r.o,A),u=dot(s,p)*inv;if(u<0||u>1)continue;const q=cross(s,e1),v=dot(r.d,q)*inv;if(v<0||u+v>1)continue;const d=dot(e2,q)*inv;if(d>0&&d<best)best=d;}
  if(!isFinite(best))return null;const hit=[r.o[0]+r.d[0]*best,r.o[1]+r.d[1]*best,r.o[2]+r.d[2]*best];
  // snap to a corner of that board within 14 px
  let snap=null,sd=14;
  for(let k=edgeStart[i],e=k+edgeCount[i];k<e;k++){const q=[epos[k*3],epos[k*3+1],epos[k*3+2]],s=project(c.vp,q);if(!s)continue;const d=Math.hypot(s[0]-px,s[1]-py);if(d<sd){sd=d;snap=q;}}
  return snap||hit;}
function drawMeasure(c){const el=$('mdots');if(S.mode!=='measure'||!M.pts.length){if(el.firstChild)el.textContent='';return;}
  while(el.childElementCount<M.pts.length)el.appendChild(document.createElement('i'));while(el.childElementCount>M.pts.length)el.lastChild.remove();
  M.pts.forEach((q,k)=>{const s=project(c.vp,q),d=el.children[k];if(s){d.style.display='';d.style.left=s[0]+'px';d.style.top=s[1]+'px';}else d.style.display='none';});}
function measureTap(px,py){const q=surfacePoint(px,py);if(!q){hint('Chạm đúng vào bề mặt tấm.');return;}
  if(M.pts.length>=2)M.pts=[];M.pts.push(q);
  if(M.pts.length===2){const [a,b]=M.pts,d=Math.hypot(b[0]-a[0],b[1]-a[1],b[2]-a[2]);
    $('measure').innerHTML=d.toFixed(1)+' mm <small style="color:#6b7684;font-weight:500">(ΔX '+Math.abs(b[0]-a[0]).toFixed(0)+' · ΔY '+Math.abs(b[1]-a[1]).toFixed(0)+' · ΔZ '+Math.abs(b[2]-a[2]).toFixed(0)+')</small>';$('measure').style.display='block';hint('Chạm điểm mới để đo tiếp · bấm Đo kích thước để thoát.',0);}
  else{$('measure').style.display='none';hint('Chạm điểm thứ hai (tự bắt vào góc tấm).',0);}
  redraw();}

// ---------- region ----------
function regionPick(a,b){const x0=Math.min(a[0],b[0]),x1=Math.max(a[0],b[0]),y0=Math.min(a[1],b[1]),y1=Math.max(a[1],b[1]);if(x1-x0<8||y1-y0<8){hint('Kéo khung lớn hơn.');return;}
  const c=viewProj(),inside=[];for(let i=0;i<N;i++){if(parts[i].c==='label'||!(stateTex[i*4]&F_VIS))continue;const o=i*6,q=project(c.vp,[(box[o]+box[o+3])/2,(box[o+1]+box[o+4])/2,(box[o+2]+box[o+5])/2]);if(q&&q[0]>=x0&&q[0]<=x1&&q[1]>=y0&&q[1]<=y1)inside.push(i);}
  if(!inside.length){hint('Vùng khoanh không có tấm nào.');return;}
  S.solo=new Set(inside);S.forced.clear();S.sel.clear();S.dim=false;setMode('orbit');refreshState();fit(sceneBox(i=>S.solo.has(i)));hint('Đang xem '+inside.length+' đối tượng trong vùng · Hiện tất cả để xem lại.',5000);}

// ---------- actions ----------
function setMode(m){S.mode=m;M.pts=[];$('measure').style.display='none';$('rect').style.display='none';syncButtons();redraw();
  hint(m==='measure'?'Chạm 2 điểm trên tấm để đo (tự bắt vào góc tấm).':m==='region'?'Kéo một khung quanh vùng muốn xem (2 ngón vẫn xoay / phóng được).':'',m==='orbit'?3500:0);}
function act(a){
  if(a==='fold'){foldTools(!$('app').classList.contains('min'));return;}
  if(a==='find'){openSheet('sh-find');renderList();setTimeout(()=>$('q').focus(),60);return;}
  if(a==='hide'){if(!S.sel.size){hint('Chạm vào tấm cần ẩn trước.');return;}for(const i of S.sel){S.hidden[i]=1;S.forced.delete(i);}S.sel.clear();S.dim=false;closeSheet('sh-info');refreshState();syncButtons();return;}
  if(a==='solo'){if(!S.sel.size){hint('Chạm vào tấm muốn xem riêng trước.');return;}S.solo=new Set(S.sel);S.dim=false;refreshState();fit(sceneBox(i=>S.solo.has(i)),1.6);closeSheet('sh-info');syncButtons();return;}
  if(a==='showall'){S.hidden.fill(0);S.solo=null;S.forced.clear();S.dim=false;for(const k of ['door','back','wall','label'])S.catOn[k]=true;refreshState();}
  if(a==='xray'){S.xray=!S.xray;refreshState();}
  if(['door','back','wall','label'].includes(a)){S.catOn[a]=!S.catOn[a];for(const i of [...S.forced])if(parts[i].c===a)S.forced.delete(i);refreshState();}
  if(a==='tags'){renderTags();openSheet('sh-tags');return;}
  if(a==='region'){setMode(S.mode==='region'?'orbit':'region');return;}
  if(a==='measure'){setMode(S.mode==='measure'?'orbit':'measure');return;}
  if(a==='info'){showInfo();return;}
  if(a==='ids'){S.ids=!S.ids;badgesDirty=true;$('badges').style.visibility='';redraw();}
  if(a==='color'){S.colorMode=1-S.colorMode;redraw();}
  if(a==='home'){S.hidden.fill(0);S.solo=null;S.forced.clear();S.sel.clear();S.dim=false;S.xray=false;S.ids=false;S.colorMode=0;for(const k of ['door','back','wall','label'])S.catOn[k]=true;H.tags.forEach((t,i)=>tagOn[i]=t.v!==false);setMode('orbit');
    document.querySelectorAll('.sheet').forEach(s=>s.classList.remove('open'));refreshState();Object.assign(cam,JSON.parse(home));redraw();if(location.hash)history.replaceState(null,'',location.pathname+location.search);}
  syncButtons();}
// The tool panel folds down to one row of the most used buttons; the view
// gets the room, and the choice is kept for next time.
function foldTools(min){$('app').classList.toggle('min',min);$('fold-text').textContent=min?'Mở thêm công cụ ▴':'Thu gọn công cụ ▾';document.querySelector('#tools .handle').setAttribute('aria-expanded',String(!min));store.set('tools_min',min);badgesDirty=true;redraw();}
function syncButtons(){const on={xray:S.xray,ids:S.ids,color:S.colorMode===1,region:S.mode==='region',measure:S.mode==='measure'};
  for(const b of document.querySelectorAll('#tools button')){const a=b.dataset.act;
    if(['door','back','wall','label'].includes(a)){b.classList.toggle('on',!!S.catOn[a]);b.classList.toggle('off',!S.catOn[a]);}
    else if(a in on)b.classList.toggle('on',on[a]);}}
document.getElementById('tools').addEventListener('click',e=>{const b=e.target.closest('button');if(b)act(b.dataset.act);});

// ---------- input ----------
const ptr=new Map();let gesture=null,lastTap=0,lastTapAt=[0,0];
const at=e=>{const r=canvas.getBoundingClientRect();return [e.clientX-r.left,e.clientY-r.top];};
canvas.addEventListener('contextmenu',e=>e.preventDefault());
canvas.addEventListener('pointerdown',e=>{try{canvas.setPointerCapture(e.pointerId);}catch(_){}const p=at(e);ptr.set(e.pointerId,p);
  if(ptr.size===1)gesture={start:p,last:p,t:performance.now(),moved:false,pan:e.button===1||e.button===2||e.shiftKey};
  else if(ptr.size===2){const [a,b]=[...ptr.values()];gesture={two:true,d:Math.hypot(a[0]-b[0],a[1]-b[1]),c:[(a[0]+b[0])/2,(a[1]+b[1])/2],moved:true};$('rect').style.display='none';}});
canvas.addEventListener('pointermove',e=>{if(!ptr.has(e.pointerId)||!gesture)return;const p=at(e);ptr.set(e.pointerId,p);
  if(gesture.two&&ptr.size>=2){const [a,b]=[...ptr.values()],d=Math.hypot(a[0]-b[0],a[1]-b[1]),c=[(a[0]+b[0])/2,(a[1]+b[1])/2];interacting();
    panBy(c[0]-gesture.c[0],c[1]-gesture.c[1]);if(gesture.d>0&&d>0)zoomAt(c[0],c[1],gesture.d/d);gesture.d=d;gesture.c=c;redraw();return;}
  const dx=p[0]-gesture.last[0],dy=p[1]-gesture.last[1];if(!gesture.moved&&Math.hypot(p[0]-gesture.start[0],p[1]-gesture.start[1])>7)gesture.moved=true;gesture.last=p;
  if(!gesture.moved)return;
  if(S.mode==='region'&&!gesture.pan){const r=$('rect'),x=Math.min(p[0],gesture.start[0]),y=Math.min(p[1],gesture.start[1]);Object.assign(r.style,{display:'block',left:x+'px',top:y+'px',width:Math.abs(p[0]-gesture.start[0])+'px',height:Math.abs(p[1]-gesture.start[1])+'px'});return;}
  interacting();
  if(gesture.pan)panBy(dx,dy);else{cam.yaw-=dx*0.008*S.speed;cam.pitch=Math.max(-1.5,Math.min(1.5,cam.pitch+dy*0.008*S.speed));}redraw();});
function endPointer(e){if(!ptr.has(e.pointerId))return;const p=at(e);ptr.delete(e.pointerId);if(!gesture)return;
  if(gesture.two){gesture=ptr.size?{start:[...ptr.values()][0],last:[...ptr.values()][0],t:0,moved:true}:null;return;}
  if(ptr.size)return;const g=gesture;gesture=null;
  if(e.type==='pointercancel'){$('rect').style.display='none';return;}
  if(S.mode==='region'&&g.moved&&!g.pan){$('rect').style.display='none';regionPick(g.start,p);return;}
  if(g.moved||performance.now()-g.t>600)return;
  tap(p[0],p[1]);}
canvas.addEventListener('pointerup',endPointer);canvas.addEventListener('pointercancel',endPointer);
function tap(x,y){if(S.mode==='measure'){measureTap(x,y);return;}if(S.mode==='region')return;
  const now=performance.now(),double=now-lastTap<330&&Math.hypot(x-lastTapAt[0],y-lastTapAt[1])<30;lastTap=double?0:now;lastTapAt=[x,y];const i=pick(x,y);
  if(double&&i>=0){select([i],{dim:S.dim});focusOn(sceneBox(j=>j===i),$('sh-info').classList.contains('open'));return;}
  if(i<0){if(S.sel.size)select([]);return;}
  if(S.sel.has(i)&&S.sel.size===1){showInfo();return;}
  select([i],{dim:S.dim});hint(title(parts[i])+(parts[i].id?' · ID '+parts[i].id:''));}
function panBy(dx,dy){const c=viewProj(),k=2*cam.dist*Math.tan(cam.fov/2)/Math.max(1,canvas.clientHeight);for(let j=0;j<3;j++)cam.target[j]+=(-dx*c.s[j]+dy*c.u[j])*k;}
canvas.addEventListener('wheel',e=>{e.preventDefault();interacting();const p=at(e);zoomAt(p[0],p[1],Math.exp(Math.max(-60,Math.min(60,e.deltaY))*0.0025));redraw();},{passive:false});
window.addEventListener('resize',()=>{badgesDirty=true;redraw();});
if(window.ResizeObserver)new ResizeObserver(()=>{badgesDirty=true;redraw();}).observe(canvas);
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&document.activeElement!==$('q')){setMode('orbit');select([]);}});

// ---------- QR scan (camera) ----------
let stream=null,scanning=false;
async function startScan(){if(!navigator.mediaDevices?.getUserMedia){hint('Trình duyệt không cho mở camera (cần link https). Dùng camera điện thoại quét tem, hoặc gõ số ID.',6000);return;}
  try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'environment'},audio:false});}catch(e){hint('Không mở được camera ('+e.name+'). Cho phép camera hoặc gõ số ID.',6000);return;}
  const v=$('video');v.srcObject=stream;await v.play().catch(()=>{});$('scan').classList.add('open');scanning=true;
  let detector=null;try{if('BarcodeDetector' in window)detector=new window.BarcodeDetector({formats:['qr_code']});}catch(e){detector=null;}
  const cv=document.createElement('canvas'),cx=cv.getContext('2d',{willReadFrequently:true});
  const loop=async()=>{if(!scanning)return;let text=null;
    try{if(v.readyState>=2){if(detector){const r=await detector.detect(v);if(r.length)text=r[0].rawValue;}
      else if(window.jsQR){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/Math.max(1,v.videoWidth));cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)text=r.data;}}}catch(e){}
    if(text){stopScan();found(text);return;}setTimeout(loop,200);};loop();}
function stopScan(){scanning=false;$('scan').classList.remove('open');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function found(text){
  // a label of another drawing: open that drawing
  if(/^https?:\/\//i.test(text)){const here=location.href.split('#')[0],there=text.split('#')[0];if(there&&there!==here&&!/^file:/i.test(location.href)){location.href=text;return;}}
  const r=lookup(text);if(!r.length){hint('Không thấy tấm của mã: '+text.slice(0,60),6000);$('q').value=keyFrom(text);openSheet('sh-find');renderList();return;}
  closeSheet('sh-find');select(r,{dim:true,focus:true,info:r.length===1});}
$('scan-open').addEventListener('click',startScan);$('scan-close').addEventListener('click',stopScan);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scanning)stopScan();});

// ---------- start ----------
function fatal(msg){const e=document.getElementById('err');if(e){e.textContent=msg;e.style.display='flex';}const h=document.getElementById('hint');if(h)h.textContent='';}
$('company').textContent=H.company||'Bản vẽ lắp đặt 3D';
$('title').textContent=(H.title||H.model||'Bản vẽ')+(H.company?' · Bản vẽ 3D':'');
document.title=(H.title||H.model||'Bản vẽ')+' · Bản vẽ 3D';
{const b=sceneBox();if(b)sceneRadius=Math.max(200,Math.hypot(b[3]-b[0],b[4]-b[1],b[5]-b[2])/2);resize();fit(b);home=JSON.stringify(cam);}
refreshState();syncButtons();if(store.get('tools_min',false))foldTools(true);
function fromHash(){const m=(location.hash+'&'+location.search).match(/[#&?]p=([^&#]+)/);if(!m)return false;const r=lookup(decodeURIComponent(m[1]),true);
  if(r.length){select(r,{dim:true,focus:true,info:r.length===1});hint(r.length===1?'Tấm '+(parts[r[0]].id?'ID '+parts[r[0]].id+' · ':'')+(parts[r[0]].n||''):'',5000);}else hint('Không thấy tấm của mã QR này trong bản vẽ.',6000);return true;}
if(!fromHash())hint('1 ngón xoay · 2 ngón kéo / thu phóng · chạm để chọn tấm',4500);
window.addEventListener('hashchange',fromHash);
window.HPViewer={parts,select,lookup,act,cam,redraw,pick,state:S,fit,sceneBox,zoomAt,stats:()=>({triangles:idx.length/3,edges:epid.length/2,frameGap,lowRes,canvas:[canvas.width,canvas.height]})};
}
requestAnimationFrame(()=>setTimeout(hpViewerMain,20));
</script>
