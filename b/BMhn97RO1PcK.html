<style>
:root{--blue:#1f5fa8;--blue2:#2a6fc0;--ink:#17202b;--muted:#6b7684;--line:#d8dee6;--bg:#eef1f4;--orange:#f08a24;--green:#22875a}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font:14px/1.35 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
#app{display:flex;flex-direction:column;height:100%;height:100dvh}
header{background:var(--blue);color:#fff;padding:8px 12px calc(8px) 12px;padding-top:max(8px,env(safe-area-inset-top))}
header .co{font-weight:800;font-size:17px;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
header .sub{display:flex;gap:8px;align-items:baseline;justify-content:space-between;font-size:12px;opacity:.92}
header .sub b{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:65%}
#stage{position:relative;flex:1;min-height:0;background:linear-gradient(#f6f7f9,#e4e8ed)}
canvas#gl{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#badges{position:absolute;inset:0;pointer-events:none;overflow:hidden}
#badges span{position:absolute;left:0;top:0;will-change:transform;background:rgba(255,255,255,.92);border:1px solid #9aa6b4;border-radius:9px;padding:0 5px;font-size:11px;font-weight:700;color:#173a63;white-space:nowrap}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:rgba(23,32,43,.82);color:#fff;border-radius:16px;padding:5px 12px;font-size:12.5px;max-width:92%;text-align:center;pointer-events:none;transition:opacity .25s}
#hint:empty{opacity:0}
#rect{position:absolute;border:2px dashed var(--orange);background:rgba(240,138,36,.12);display:none;pointer-events:none}
#measure{position:absolute;left:50%;bottom:10px;transform:translateX(-50%);background:#fff;border:1px solid var(--line);border-radius:10px;padding:6px 12px;font-weight:700;display:none;box-shadow:0 2px 8px rgba(0,0,0,.12)}
#mdots{position:absolute;inset:0;pointer-events:none}
#mdots i{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%;background:var(--orange);border:2px solid #fff;box-shadow:0 0 0 1px var(--orange)}
#tools{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;padding:5px;padding-bottom:max(6px,env(safe-area-inset-bottom));background:#fff;border-top:1px solid var(--line)}
@media (min-width:760px){#tools{grid-template-columns:repeat(8,1fr)}}
#tools button{touch-action:manipulation;user-select:none;-webkit-user-select:none;border:0;border-radius:8px;background:var(--blue2);color:#fff;font:600 12px/1.15 inherit;font-family:inherit;padding:6px 3px;min-height:36px;cursor:pointer}
#tools button.on{background:var(--green)}
#tools button.handle{grid-column:1/-1;min-height:24px;padding:2px 0 3px;background:transparent;color:var(--blue);font-size:12px;display:flex;flex-direction:column;align-items:center;gap:2px}
#tools button.handle .grip{width:38px;height:4px;border-radius:2px;background:#c3ccd7}
#app.min #tools button:not([data-quick]):not(.handle){display:none}
#app.min #tools{grid-template-columns:repeat(4,1fr)}
#tools button[data-act=home]{grid-column:span 4}
@media (min-width:760px){#tools button[data-act=home]{grid-column:span 1}}
#app.min #tools button[data-act=home]{grid-column:span 1}
#tools button.off{background:#9fb3c9}
#tools button.dark{background:#26313d}
#tools button:active{filter:brightness(.9)}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:58%;background:#fff;border-radius:14px 14px 0 0;box-shadow:0 -4px 18px rgba(0,0,0,.18);display:none;flex-direction:column;z-index:5}
.sheet.open{display:flex}
.sheet .bar{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line)}
.sheet .bar h3{margin:0;font-size:15px;flex:1}
.sheet .bar button,.btn{touch-action:manipulation;border:1px solid var(--line);background:#f4f6f8;border-radius:8px;padding:6px 10px;font:600 13px inherit;font-family:inherit;color:var(--ink);cursor:pointer}
.btn.primary{background:var(--blue);border-color:var(--blue);color:#fff}
.sheet .body{overflow:auto;padding:8px 12px 12px}
.search{display:flex;gap:6px;margin-bottom:8px}
.search input{flex:1;min-width:0;border:1px solid var(--line);border-radius:8px;padding:9px 10px;font-size:15px}
.row{display:flex;gap:10px;align-items:center;padding:8px 4px;border-bottom:1px solid #eef1f4;cursor:pointer}
.row:active{background:#f1f5fa}
.row .num{min-width:42px;text-align:center;font-weight:800;color:var(--blue);background:#eaf1fa;border-radius:7px;padding:3px 4px}
.row .t{flex:1;min-width:0}
.row .t div{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row .t small{color:var(--muted)}
.row.hiddenpart{opacity:.5}
label.tag{display:flex;align-items:center;gap:10px;padding:9px 2px;border-bottom:1px solid #eef1f4}
label.tag input{width:20px;height:20px}
.kv{display:grid;grid-template-columns:auto 1fr auto 1fr;gap:3px 10px;margin:8px 0 4px;font-size:13px}
@media (max-width:420px){.kv{grid-template-columns:auto 1fr}}
.kv span{min-width:0;overflow-wrap:anywhere}
.kv b{color:var(--muted);font-weight:600}
.acts{display:flex;flex-wrap:wrap;gap:6px}
#scan{position:fixed;inset:0;background:#000;z-index:20;display:none;flex-direction:column}
#scan.open{display:flex}
#scan video{flex:1;width:100%;object-fit:cover;min-height:0}
#scan .bar{display:flex;gap:8px;padding:12px;background:#111;color:#fff;align-items:center}
#scan .bar span{flex:1}
#err{position:absolute;inset:0;display:none;align-items:center;justify-content:center;text-align:center;padding:24px;color:#7a1d1d;font-weight:600}
.foot{color:var(--muted);font-size:11.5px;margin-top:8px}
</style>
</head>

</div>

<script>var HPInflate=(function(){var module={exports:{}};
var TINF_OK = 0;
var TINF_DATA_ERROR = -3;

function Tree() {
  this.table = new Uint16Array(16);   /* table of code length counts */
  this.trans = new Uint16Array(288);  /* code -> symbol translation table */
}

function Data(source, dest) {
  this.source = source;
  this.sourceIndex = 0;
  this.tag = 0;
  this.bitcount = 0;
  
  this.dest = dest;
  this.destLen = 0;
  
  this.ltree = new Tree();  /* dynamic length/symbol tree */
  this.dtree = new Tree();  /* dynamic distance tree */
}

/* --------------------------------------------------- *
 * -- uninitialized global data (static structures) -- *
 * --------------------------------------------------- */

var sltree = new Tree();
var sdtree = new Tree();

/* extra bits and base tables for length codes */
var length_bits = new Uint8Array(30);
var length_base = new Uint16Array(30);

/* extra bits and base tables for distance codes */
var dist_bits = new Uint8Array(30);
var dist_base = new Uint16Array(30);

/* special ordering of code length codes */
var clcidx = new Uint8Array([
  16, 17, 18, 0, 8, 7, 9, 6,
  10, 5, 11, 4, 12, 3, 13, 2,
  14, 1, 15
]);

/* used by tinf_decode_trees, avoids allocations every call */
var code_tree = new Tree();
var lengths = new Uint8Array(288 + 32);

/* ----------------------- *
 * -- utility functions -- *
 * ----------------------- */

/* build extra bits and base tables */
function tinf_build_bits_base(bits, base, delta, first) {
  var i, sum;

  /* build bits table */
  for (i = 0; i < delta; ++i) bits[i] = 0;
  for (i = 0; i < 30 - delta; ++i) bits[i + delta] = i / delta | 0;

  /* build base table */
  for (sum = first, i = 0; i < 30; ++i) {
    base[i] = sum;
    sum += 1 << bits[i];
  }
}

/* build the fixed huffman trees */
function tinf_build_fixed_trees(lt, dt) {
  var i;

  /* build fixed length tree */
  for (i = 0; i < 7; ++i) lt.table[i] = 0;

  lt.table[7] = 24;
  lt.table[8] = 152;
  lt.table[9] = 112;

  for (i = 0; i < 24; ++i) lt.trans[i] = 256 + i;
  for (i = 0; i < 144; ++i) lt.trans[24 + i] = i;
  for (i = 0; i < 8; ++i) lt.trans[24 + 144 + i] = 280 + i;
  for (i = 0; i < 112; ++i) lt.trans[24 + 144 + 8 + i] = 144 + i;

  /* build fixed distance tree */
  for (i = 0; i < 5; ++i) dt.table[i] = 0;

  dt.table[5] = 32;

  for (i = 0; i < 32; ++i) dt.trans[i] = i;
}

/* given an array of code lengths, build a tree */
var offs = new Uint16Array(16);

function tinf_build_tree(t, lengths, off, num) {
  var i, sum;

  /* clear code length count table */
  for (i = 0; i < 16; ++i) t.table[i] = 0;

  /* scan symbol lengths, and sum code length counts */
  for (i = 0; i < num; ++i) t.table[lengths[off + i]]++;

  t.table[0] = 0;

  /* compute offset table for distribution sort */
  for (sum = 0, i = 0; i < 16; ++i) {
    offs[i] = sum;
    sum += t.table[i];
  }

  /* create code->symbol translation table (symbols sorted by code) */
  for (i = 0; i < num; ++i) {
    if (lengths[off + i]) t.trans[offs[lengths[off + i]]++] = i;
  }
}

/* ---------------------- *
 * -- decode functions -- *
 * ---------------------- */

/* get one bit from source stream */
function tinf_getbit(d) {
  /* check if tag is empty */
  if (!d.bitcount--) {
    /* load next tag */
    d.tag = d.source[d.sourceIndex++];
    d.bitcount = 7;
  }

  /* shift bit out of tag */
  var bit = d.tag & 1;
  d.tag >>>= 1;

  return bit;
}

/* read a num bit value from a stream and add base */
function tinf_read_bits(d, num, base) {
  if (!num)
    return base;

  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }

  var val = d.tag & (0xffff >>> (16 - num));
  d.tag >>>= num;
  d.bitcount -= num;
  return val + base;
}

/* given a data stream and a tree, decode a symbol */
function tinf_decode_symbol(d, t) {
  while (d.bitcount < 24) {
    d.tag |= d.source[d.sourceIndex++] << d.bitcount;
    d.bitcount += 8;
  }
  
  var sum = 0, cur = 0, len = 0;
  var tag = d.tag;

  /* get more bits while code value is above sum */
  do {
    cur = 2 * cur + (tag & 1);
    tag >>>= 1;
    ++len;

    sum += t.table[len];
    cur -= t.table[len];
  } while (cur >= 0);
  
  d.tag = tag;
  d.bitcount -= len;

  return t.trans[sum + cur];
}

/* given a data stream, decode dynamic trees from it */
function tinf_decode_trees(d, lt, dt) {
  var hlit, hdist, hclen;
  var i, num, length;

  /* get 5 bits HLIT (257-286) */
  hlit = tinf_read_bits(d, 5, 257);

  /* get 5 bits HDIST (1-32) */
  hdist = tinf_read_bits(d, 5, 1);

  /* get 4 bits HCLEN (4-19) */
  hclen = tinf_read_bits(d, 4, 4);

  for (i = 0; i < 19; ++i) lengths[i] = 0;

  /* read code lengths for code length alphabet */
  for (i = 0; i < hclen; ++i) {
    /* get 3 bits code length (0-7) */
    var clen = tinf_read_bits(d, 3, 0);
    lengths[clcidx[i]] = clen;
  }

  /* build code length tree */
  tinf_build_tree(code_tree, lengths, 0, 19);

  /* decode code lengths for the dynamic trees */
  for (num = 0; num < hlit + hdist;) {
    var sym = tinf_decode_symbol(d, code_tree);

    switch (sym) {
      case 16:
        /* copy previous code length 3-6 times (read 2 bits) */
        var prev = lengths[num - 1];
        for (length = tinf_read_bits(d, 2, 3); length; --length) {
          lengths[num++] = prev;
        }
        break;
      case 17:
        /* repeat code length 0 for 3-10 times (read 3 bits) */
        for (length = tinf_read_bits(d, 3, 3); length; --length) {
          lengths[num++] = 0;
        }
        break;
      case 18:
        /* repeat code length 0 for 11-138 times (read 7 bits) */
        for (length = tinf_read_bits(d, 7, 11); length; --length) {
          lengths[num++] = 0;
        }
        break;
      default:
        /* values 0-15 represent the actual code lengths */
        lengths[num++] = sym;
        break;
    }
  }

  /* build dynamic trees */
  tinf_build_tree(lt, lengths, 0, hlit);
  tinf_build_tree(dt, lengths, hlit, hdist);
}

/* ----------------------------- *
 * -- block inflate functions -- *
 * ----------------------------- */

/* given a stream and two trees, inflate a block of data */
function tinf_inflate_block_data(d, lt, dt) {
  while (1) {
    var sym = tinf_decode_symbol(d, lt);

    /* check for end of block */
    if (sym === 256) {
      return TINF_OK;
    }

    if (sym < 256) {
      d.dest[d.destLen++] = sym;
    } else {
      var length, dist, offs;
      var i;

      sym -= 257;

      /* possibly get more bits from length code */
      length = tinf_read_bits(d, length_bits[sym], length_base[sym]);

      dist = tinf_decode_symbol(d, dt);

      /* possibly get more bits from distance code */
      offs = d.destLen - tinf_read_bits(d, dist_bits[dist], dist_base[dist]);

      /* copy match */
      for (i = offs; i < offs + length; ++i) {
        d.dest[d.destLen++] = d.dest[i];
      }
    }
  }
}

/* inflate an uncompressed block of data */
function tinf_inflate_uncompressed_block(d) {
  var length, invlength;
  var i;
  
  /* unread from bitbuffer */
  while (d.bitcount > 8) {
    d.sourceIndex--;
    d.bitcount -= 8;
  }

  /* get length */
  length = d.source[d.sourceIndex + 1];
  length = 256 * length + d.source[d.sourceIndex];

  /* get one's complement of length */
  invlength = d.source[d.sourceIndex + 3];
  invlength = 256 * invlength + d.source[d.sourceIndex + 2];

  /* check length */
  if (length !== (~invlength & 0x0000ffff))
    return TINF_DATA_ERROR;

  d.sourceIndex += 4;

  /* copy block */
  for (i = length; i; --i)
    d.dest[d.destLen++] = d.source[d.sourceIndex++];

  /* make sure we start next block on a byte boundary */
  d.bitcount = 0;

  return TINF_OK;
}

/* inflate stream from source to dest */
function tinf_uncompress(source, dest) {
  var d = new Data(source, dest);
  var bfinal, btype, res;

  do {
    /* read final block flag */
    bfinal = tinf_getbit(d);

    /* read block type (2 bits) */
    btype = tinf_read_bits(d, 2, 0);

    switch (btype) {
      case 0:
        /* decompress uncompressed block */
        res = tinf_inflate_uncompressed_block(d);
        break;

const $=id=>document.getElementById(id);
let hintTimer=0;
// Short messages clear themselves; mode instructions (ms=0) stay.
function hint(t,ms=3500){clearTimeout(hintTimer);$('hint').textContent=t||'';if(t&&ms)hintTimer=setTimeout(()=>{$('hint').textContent='';},ms);}
const CAT={panel:0,door:1,back:2,wall:3,label:4,other:5,link:6};
// Tags and links are lines drawn on a board: they follow it and are never picked or listed.
const aux=p=>p.c==='label'||p.c==='link';
const CAT_COLORS=[[0.93,0.89,0.80],[0.40,0.66,0.92],[0.62,0.78,0.48],[0.80,0.74,0.66],[0.20,0.20,0.20],[0.75,0.75,0.78],[0.35,0.35,0.40]];
const F_VIS=1,F_SEL=2,F_DIM=4;
const store={get(k,d){try{const v=localStorage.getItem('hpv.'+k);return v===null?d:JSON.parse(v);}catch(e){return d;}},set(k,v){try{localStorage.setItem('hpv.'+k,JSON.stringify(v));}catch(e){}}};

// ---------- data ----------
function decode(){
  const el=$('hp-data'),b64=el.textContent.trim(),bin=atob(b64),src=new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++)src[i]=bin.charCodeAt(i);
  const out=new Uint8Array(Number(el.dataset.size));HPInflate(src,out);el.textContent='';
  const dv=new DataView(out.buffer),hl=dv.getUint32(0,true);

  let off=4+hl;off+=(4-off%4)%4;const n=header.counts;

  const C=new Uint8Array(out.buffer,off,n.v*4);off+=n.v*4;

  const E=new Float32Array(out.buffer,off,n.e*3);
  return {header,V,C,T,E};
}
let D;
try{D=decode();}catch(e){fatal('Không đọc được dữ liệu bản vẽ ('+e.message+').');return;}
const H=D.header,parts=H.parts,N=parts.length;
// A link past its date (GitHub keeps the file until the next export) does not open.
{const m=String(H.expires||'').match(/^(\d{1,2})\/(\d{1,2})\/(\d{4})$/);if(m&&Date.now()>new Date(+m[3],+m[2]-1,+m[1],23,59,59).getTime()){fatal('Link bản vẽ này đã hết hạn ngày '+H.expires+'. Liên hệ xưởng để được gửi link mới.');return;}}
const byKey=new Map();parts.forEach((p,i)=>{p.i=i;p.cat=CAT[p.c]??5;byKey.set(p.k,i);});
parts.forEach(p=>{p.board=p.b!==undefined?byKey.get(p.b):undefined;});
const boardCount=parts.filter(p=>!aux(p)).length;

// ---------- world buffers ----------
let nv=0,nt=0,ne=0;for(const p of parts){const g=H.geoms[p.geo];nv+=g.vc;nt+=g.tc;ne+=g.ec;}
const pos=new Float32Array(nv*3),col=new Uint8Array(nv*4),pidv=new Uint32Array(nv),idx=new Uint32Array(nt),epos=new Float32Array(ne*3),epid=new Uint32Array(ne);
const box=new Float32Array(N*6),triStart=new Uint32Array(N),triCount=new Uint32Array(N),edgeStart=new Uint32Array(N),edgeCount=new Uint32Array(N),glassy=new Uint8Array(N);
{
  const lo=[Infinity,Infinity,Infinity],hi=[-Infinity,-Infinity,-Infinity];
  // scene centre from part translations keeps float32 precise
  for(const p of parts){for(let k=0;k<3;k++){const t=p.m[12+k];if(t<lo[k])lo[k]=t;if(t>hi[k])hi[k]=t;}}
  const origin=[0,1,2].map(k=>isFinite(lo[k])?(lo[k]+hi[k])/2:0);
  const geoGlass=H.geoms.map(g=>{for(let j=0;j<g.vc;j++)if(D.C[(g.vo+j)*4+3]<250)return 1;return 0;});
  let vo=0,to=0,eo=0;
  for(const p of parts){
    const g=H.geoms[p.geo],m=p.m,b=[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];
    for(let j=0;j<g.vc;j++){const s=(g.vo+j)*3,x=D.V[s],y=D.V[s+1],z=D.V[s+2],d=(vo+j)*3;
      const X=m[0]*x+m[4]*y+m[8]*z+m[12]-origin[0],Y=m[1]*x+m[5]*y+m[9]*z+m[13]-origin[1],Z=m[2]*x+m[6]*y+m[10]*z+m[14]-origin[2];
      pos[d]=X;pos[d+1]=Y;pos[d+2]=Z;if(X<b[0])b[0]=X;if(Y<b[1])b[1]=Y;if(Z<b[2])b[2]=Z;if(X>b[3])b[3]=X;if(Y>b[4])b[4]=Y;if(Z>b[5])b[5]=Z;
      col.set(D.C.subarray((g.vo+j)*4,(g.vo+j)*4+4),(vo+j)*4);pidv[vo+j]=p.i;}
    triStart[p.i]=to;triCount[p.i]=g.tc;for(let j=0;j<g.tc;j++)idx[to+j]=D.T[g.to+j]+vo;
    edgeStart[p.i]=eo;edgeCount[p.i]=g.ec;glassy[p.i]=geoGlass[p.geo];
    for(let j=0;j<g.ec;j++){const s=(g.eo+j)*3,x=D.E[s],y=D.E[s+1],z=D.E[s+2],d=(eo+j)*3;
      epos[d]=m[0]*x+m[4]*y+m[8]*z+m[12]-origin[0];epos[d+1]=m[1]*x+m[5]*y+m[9]*z+m[13]-origin[1];epos[d+2]=m[2]*x+m[6]*y+m[10]*z+m[14]-origin[2];epid[eo+j]=p.i;}
    if(!g.vc)for(let k=0;k<3;k++){b[k]=m[12+k]-origin[k];b[k+3]=b[k];}
    box.set(b,p.i*6);vo+=g.vc;to+=g.tc;eo+=g.ec;
  }
}
D=null;
const heavy=nt/3>250000;

// ---------- state ----------
const tagOn=H.tags.map(t=>t.v!==false);
const S={catOn:{door:true,back:true,wall:true,label:true,link:true},hidden:new Uint8Array(N),forced:new Set(),solo:null,sel:new Set(),dim:false,xray:false,colorMode:0,ids:false,mode:'orbit',speed:store.get('speed',1),alpha:false,busy:false};
// A board found by search / QR shows even when its kind (doors…) or its tag is off.
function baseVisible(i){
  const p=parts[i];if(S.hidden[i])return false;
  if(aux(p)){if(!S.catOn[p.c])return false;if(p.t)for(const t of p.t)if(!tagOn[t])return false;return p.board===undefined||baseVisible(p.board);}
  if(S.forced.has(i))return true;
  if(p.t)for(const t of p.t)if(!tagOn[t])return false;
  if(S.catOn[p.c]===false)return false;
  if(S.solo&&!S.solo.has(i))return false;
  return true;
}
const rows=Math.max(1,Math.ceil(N/1024)),stateTex=new Uint8Array(1024*rows*4);
let visibleCount=0;
function refreshState(){
  visibleCount=0;let alpha=S.dim||S.xray;
  for(let i=0;i<N;i++){const v=baseVisible(i),p=parts[i];if(v&&!aux(p))visibleCount++;if(v&&glassy[i])alpha=true;
    let f=v?F_VIS:0;const sel=S.sel.has(i)||(p.board!==undefined&&S.sel.has(p.board));if(sel)f|=F_SEL;else if(S.dim||S.xray)f|=F_DIM;
    stateTex[i*4]=f;stateTex[i*4+1]=p.cat;}
  S.alpha=alpha;
  gl.bindTexture(gl.TEXTURE_2D,tex);gl.texSubImage2D(gl.TEXTURE_2D,0,0,0,1024,rows,gl.RGBA_INTEGER,gl.UNSIGNED_BYTE,stateTex);
  $('count').textContent=visibleCount+'/'+boardCount+' đang hiện';
  badgesDirty=true;redraw();
}

// ---------- GL ----------
const canvas=$('gl');let gl=canvas.getContext('webgl2',{alpha:false,antialias:true,preserveDrawingBuffer:false,powerPreference:'high-performance'});
if(!gl){fatal('Trình duyệt này không hỗ trợ WebGL2. Hãy mở link bằng Chrome hoặc Safari bản mới.');return;}
canvas.addEventListener('webglcontextlost',e=>{e.preventDefault();hint('Đang tải lại bản vẽ…',0);});
canvas.addEventListener('webglcontextrestored',()=>location.reload());
function shader(type,src){const s=gl.createShader(type);gl.shaderSource(s,src);gl.compileShader(s);if(!gl.getShaderParameter(s,gl.COMPILE_STATUS))throw Error(gl.getShaderInfoLog(s));return s;}

  const u={};for(const n of ['u_vp','u_state','u_colorMode','u_cat','u_eye','u_pass']){const l=gl.getUniformLocation(p,n);if(l)u[n]=l;}p.u=u;return p;}
const VS_HEAD=`#version 300 es
precision highp float;precision highp int;
uniform mat4 u_vp;uniform highp usampler2D u_state;
layout(location=0) in vec3 a_pos;layout(location=2) in uint a_pid;
uvec4 st(){return texelFetch(u_state,ivec2(int(a_pid%1024u),int(a_pid/1024u)),0);}
`;
let meshProg,edgeProg,pickProg;
try{
meshProg=program(VS_HEAD+`
layout(location=1) in vec4 a_col;uniform int u_colorMode;uniform vec3 u_cat[7];
out vec3 v_pos;out vec4 v_col;
void main(){uvec4 s=st();if((s.r&1u)==0u){gl_Position=vec4(0.,0.,-2.,1.);v_col=vec4(0.);v_pos=vec3(0.);return;}
 vec3 c=u_colorMode==1?u_cat[s.g]:a_col.rgb;float a=a_col.a;
 if((s.r&2u)!=0u){c=mix(c,vec3(0.96,0.52,0.10),0.72);a=1.0;}else if((s.r&4u)!=0u){c=mix(c,vec3(0.55,0.66,0.78),0.35);a=min(a,0.16);}
 v_col=vec4(c,a);v_pos=a_pos;gl_Position=u_vp*vec4(a_pos,1.);}`,`#version 300 es
precision highp float;uniform int u_pass;uniform vec3 u_eye;in vec3 v_pos;in vec4 v_col;out vec4 o;
void main(){bool op=v_col.a>0.985;if(u_pass==0&&!op||u_pass==1&&op)discard;
 vec3 n=normalize(cross(dFdx(v_pos),dFdy(v_pos)));vec3 vd=normalize(u_eye-v_pos);if(dot(n,vd)<0.)n=-n;
 float l=0.52+0.30*max(dot(n,normalize(vec3(0.35,-0.55,0.75))),0.)+0.18*max(dot(n,vd),0.);
 o=vec4(v_col.rgb*l,v_col.a);}`);
edgeProg=program(VS_HEAD+`
out vec4 v_col;
void main(){uvec4 s=st();if((s.r&1u)==0u){gl_Position=vec4(0.,0.,-2.,1.);v_col=vec4(0.);return;}
 v_col=(s.r&2u)!=0u?vec4(0.55,0.24,0.02,1.):(s.r&4u)!=0u?vec4(0.16,0.22,0.30,0.55):vec4(0.13,0.15,0.18,0.85);
 gl_Position=u_vp*vec4(a_pos,1.);}`,`#version 300 es
precision highp float;in vec4 v_col;out vec4 o;void main(){o=v_col;}`);
pickProg=program(VS_HEAD+`
flat out uint v_id;
void main(){uvec4 s=st();v_id=a_pid+1u;if((s.r&1u)==0u){gl_Position=vec4(0.,0.,-2.,1.);return;}gl_Position=u_vp*vec4(a_pos,1.);}`,`#version 300 es
precision highp float;precision highp int;flat in uint v_id;out vec4 o;
void main(){o=vec4(float(v_id&255u),float((v_id>>8u)&255u),float((v_id>>16u)&255u),255.)/255.;}`);
}catch(e){fatal('Điện thoại không dựng được hình 3D ('+e.message+').');return;}
function buffer(target,data){const b=gl.createBuffer();gl.bindBuffer(target,b);gl.bufferData(target,data,gl.STATIC_DRAW);return b;}
const meshVao=gl.createVertexArray();gl.bindVertexArray(meshVao);
buffer(gl.ARRAY_BUFFER,pos);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
buffer(gl.ARRAY_BUFFER,col);gl.enableVertexAttribArray(1);gl.vertexAttribPointer(1,4,gl.UNSIGNED_BYTE,true,0,0);
buffer(gl.ARRAY_BUFFER,pidv);gl.enableVertexAttribArray(2);gl.vertexAttribIPointer(2,1,gl.UNSIGNED_INT,0,0);
buffer(gl.ELEMENT_ARRAY_BUFFER,idx);
const edgeVao=gl.createVertexArray();gl.bindVertexArray(edgeVao);
buffer(gl.ARRAY_BUFFER,epos);gl.enableVertexAttribArray(0);gl.vertexAttribPointer(0,3,gl.FLOAT,false,0,0);
gl.disableVertexAttribArray(1);gl.vertexAttrib4f(1,0,0,0,1);
buffer(gl.ARRAY_BUFFER,epid);gl.enableVertexAttribArray(2);gl.vertexAttribIPointer(2,1,gl.UNSIGNED_INT,0,0);
gl.bindVertexArray(null);
const tex=gl.createTexture();gl.bindTexture(gl.TEXTURE_2D,tex);
gl.texImage2D(gl.TEXTURE_2D,0,gl.RGBA8UI,1024,rows,0,gl.RGBA_INTEGER,gl.UNSIGNED_BYTE,stateTex);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MIN_FILTER,gl.NEAREST);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_MAG_FILTER,gl.NEAREST);
gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_S,gl.CLAMP_TO_EDGE);gl.texParameteri(gl.TEXTURE_2D,gl.TEXTURE_WRAP_T,gl.CLAMP_TO_EDGE);
let pickFbo=null,pickW=0,pickH=0;
function ensurePick(){if(pickFbo&&pickW===canvas.width&&pickH===canvas.height)return;pickW=canvas.width;pickH=canvas.height;
  pickFbo=gl.createFramebuffer();gl.bindFramebuffer(gl.FRAMEBUFFER,pickFbo);
  const c=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,c);gl.renderbufferStorage(gl.RENDERBUFFER,gl.RGBA8,pickW,pickH);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.COLOR_ATTACHMENT0,gl.RENDERBUFFER,c);
  const d=gl.createRenderbuffer();gl.bindRenderbuffer(gl.RENDERBUFFER,d);gl.renderbufferStorage(gl.RENDERBUFFER,gl.DEPTH_COMPONENT24,pickW,pickH);gl.framebufferRenderbuffer(gl.FRAMEBUFFER,gl.DEPTH_ATTACHMENT,gl.RENDERBUFFER,d);
  gl.bindFramebuffer(gl.FRAMEBUFFER,null);}

// ---------- camera (Z up) ----------
const cam={target:[0,0,0],yaw:-0.9,pitch:0.42,dist:5000,fov:40*Math.PI/180};let home=null,sceneRadius=1000;
function sceneBox(filter){const b=[Infinity,Infinity,Infinity,-Infinity,-Infinity,-Infinity];let any=false;
  for(let i=0;i<N;i++){if(filter&&!filter(i))continue;const o=i*6;if(!isFinite(box[o]))continue;any=true;for(let k=0;k<3;k++){b[k]=Math.min(b[k],box[o+k]);b[k+3]=Math.max(b[k+3],box[o+3+k]);}}
  return any?b:null;}
function fit(b,pad=1.15){if(!b)return;cam.target=[(b[0]+b[3])/2,(b[1]+b[4])/2,(b[2]+b[5])/2];const r=Math.max(40,Math.hypot(b[3]-b[0],b[4]-b[1],b[5]-b[2])/2);
  const aspect=canvas.clientWidth/Math.max(1,canvas.clientHeight),f=Math.min(cam.fov,2*Math.atan(Math.tan(cam.fov/2)*aspect));cam.dist=Math.min(sceneRadius*30,r/Math.sin(f/2)*pad);redraw();}
function eye(){const cp=Math.cos(cam.pitch);return [cam.target[0]+cam.dist*cp*Math.cos(cam.yaw),cam.target[1]+cam.dist*cp*Math.sin(cam.yaw),cam.target[2]+cam.dist*Math.sin(cam.pitch)];}
function sub(a,b){return [a[0]-b[0],a[1]-b[1],a[2]-b[2]];}function cross(a,b){return [a[1]*b[2]-a[2]*b[1],a[2]*b[0]-a[0]*b[2],a[0]*b[1]-a[1]*b[0]];}
function dot(a,b){return a[0]*b[0]+a[1]*b[1]+a[2]*b[2];}function norm(a){const l=Math.hypot(a[0],a[1],a[2])||1;return [a[0]/l,a[1]/l,a[2]/l];}
function mul(a,b){const o=new Float32Array(16);for(let c=0;c<4;c++)for(let r=0;r<4;r++){let s=0;for(let k=0;k<4;k++)s+=a[k*4+r]*b[c*4+k];o[c*4+r]=s;}return o;}
function viewProj(){const e=eye(),f=norm(sub(cam.target,e)),s=norm(cross(f,[0,0,1])),u=cross(s,f);
  const v=new Float32Array([s[0],u[0],-f[0],0,s[1],u[1],-f[1],0,s[2],u[2],-f[2],0,-dot(s,e),-dot(u,e),dot(f,e),1]);
  // near plane follows the camera distance: close-up views keep a sharp depth range (no flicker)
  const near=Math.max(1,Math.min(cam.dist*0.03,Math.max(1,cam.dist-sceneRadius*2))),far=cam.dist+sceneRadius*3,a=canvas.width/Math.max(1,canvas.height),t=1/Math.tan(cam.fov/2);
  const p=new Float32Array([t/a,0,0,0,0,t,0,0,0,0,(far+near)/(near-far),-1,0,0,2*far*near/(near-far),0]);
  return {vp:mul(p,v),eye:e,s,u,f,t,a};}
function project(m,q){const x=m[0]*q[0]+m[4]*q[1]+m[8]*q[2]+m[12],y=m[1]*q[0]+m[5]*q[1]+m[9]*q[2]+m[13],w=m[3]*q[0]+m[7]*q[1]+m[11]*q[2]+m[15];
  if(w<=0)return null;return [(x/w*0.5+0.5)*canvas.clientWidth,(1-(y/w*0.5+0.5))*canvas.clientHeight];}
function ray(px,py,c=viewProj()){const nx=(px/canvas.clientWidth)*2-1,ny=1-(py/canvas.clientHeight)*2;
  const dir=norm([c.f[0]+c.s[0]*nx*c.a/c.t+c.u[0]*ny/c.t,c.f[1]+c.s[1]*nx*c.a/c.t+c.u[1]*ny/c.t,c.f[2]+c.s[2]*nx*c.a/c.t+c.u[2]*ny/c.t]);return {o:c.eye,d:dir,f:c.f};}
// Zoom about the point under the finger / cursor (at the depth of the pivot).
function zoomAt(px,py,factor){const nd=Math.max(15,Math.min(sceneRadius*30,cam.dist*factor));factor=nd/cam.dist;
  const r=ray(px,py),den=dot(r.d,r.f);if(Math.abs(den)>1e-6){const t=dot(sub(cam.target,r.o),r.f)/den,P=[r.o[0]+r.d[0]*t,r.o[1]+r.d[1]*t,r.o[2]+r.d[2]*t];
    for(let k=0;k<3;k++)cam.target[k]=P[k]+(cam.target[k]-P[k])*factor;}
  cam.dist=nd;}

// ---------- draw ----------
// While a finger moves, a slow phone draws at a lower resolution, then sharp again when it stops.
let dirty=false,lastDraw=0,frameGap=16,lowRes=false,moving=false,idleTimer=0,badgesDirty=true;
const fullDpr=Math.min(window.devicePixelRatio||1,2);
function redraw(){if(!dirty){dirty=true;requestAnimationFrame(draw);}}
function interacting(){moving=true;clearTimeout(idleTimer);idleTimer=setTimeout(()=>{moving=false;badgesDirty=true;$('badges').style.visibility='';redraw();},160);if(S.ids)$('badges').style.visibility='hidden';}
function resize(){const dpr=moving&&lowRes?Math.min(1,fullDpr):fullDpr,w=Math.max(1,Math.round(canvas.clientWidth*dpr)),h=Math.max(1,Math.round(canvas.clientHeight*dpr));if(canvas.width!==w||canvas.height!==h){canvas.width=w;canvas.height=h;badgesDirty=true;}}
function uniforms(p,c){gl.useProgram(p);gl.uniformMatrix4fv(p.u.u_vp,false,c.vp);gl.uniform1i(p.u.u_state,0);}
const catColors=new Float32Array(CAT_COLORS.flat());
function draw(now){dirty=false;
  if(moving){if(lastDraw)frameGap=frameGap*0.8+Math.min(200,now-lastDraw)*0.2;lastDraw=now;if(!lowRes&&fullDpr>1.2&&frameGap>34)lowRes=true;}else lastDraw=0;
  resize();const c=viewProj();gl.viewport(0,0,canvas.width,canvas.height);
  gl.clearColor(0.925,0.937,0.953,1);gl.clear(gl.COLOR_BUFFER_BIT|gl.DEPTH_BUFFER_BIT);gl.enable(gl.DEPTH_TEST);
  gl.activeTexture(gl.TEXTURE0);gl.bindTexture(gl.TEXTURE_2D,tex);
  uniforms(meshProg,c);gl.uniform1i(meshProg.u.u_colorMode,S.colorMode);gl.uniform3fv(meshProg.u.u_cat,catColors);gl.uniform3fv(meshProg.u.u_eye,c.eye);
  gl.bindVertexArray(meshVao);gl.disable(gl.BLEND);gl.depthMask(true);gl.enable(gl.POLYGON_OFFSET_FILL);gl.polygonOffset(1,1);

  if(opaque){gl.uniform1i(meshProg.u.u_pass,0);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);}
  gl.disable(gl.POLYGON_OFFSET_FILL);gl.enable(gl.BLEND);gl.blendFunc(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA);gl.depthMask(false);
  gl.blendFuncSeparate(gl.SRC_ALPHA,gl.ONE_MINUS_SRC_ALPHA,gl.ONE,gl.ONE_MINUS_SRC_ALPHA);
  if(S.alpha){gl.uniform1i(meshProg.u.u_pass,1);gl.drawElements(gl.TRIANGLES,idx.length,gl.UNSIGNED_INT,0);}
  if(!(heavy&&moving&&lowRes)){uniforms(edgeProg,c);gl.bindVertexArray(edgeVao);gl.drawArrays(gl.LINES,0,epid.length);}
  gl.depthMask(true);gl.disable(gl.BLEND);gl.bindVertexArray(null);
  if(!moving&&badgesDirty)drawBadges(c);drawMeasure(c);}
function pick(px,py){ensurePick();const c=viewProj(),sx=canvas.width/canvas.clientWidth,x=Math.min(canvas.width-1,Math.max(0,Math.round(px*sx))),y=Math.min(canvas.height-1,Math.max(0,Math.round(canvas.height-py*sx)));

    for(let t=triStart[i],e=t+triCount[i];t<e;t+=3){const a=idx[t]*3,b=idx[t+1]*3,cc=idx[t+2]*3,A=[pos[a],pos[a+1],pos[a+2]],e1=sub([pos[b],pos[b+1],pos[b+2]],A),e2=sub([pos[cc],pos[cc+1],pos[cc+2]],A),p=cross(r.d,e2),det=dot(e1,p);

// ---------- region ----------

// ---------- input ----------

// ---------- QR scan (camera) ----------
let stream=null,scanning=false;

  const loop=async()=>{if(!scanning)return;let text=null;
    try{if(v.readyState>=2){if(detector){const r=await detector.detect(v);if(r.length)text=r[0].rawValue;}
      else if(window.jsQR){const w=Math.min(640,v.videoWidth),h=Math.round(v.videoHeight*w/Math.max(1,v.videoWidth));cv.width=w;cv.height=h;cx.drawImage(v,0,0,w,h);const r=window.jsQR(cx.getImageData(0,0,w,h).data,w,h,{inversionAttempts:'dontInvert'});if(r)text=r.data;}}}catch(e){}
    if(text){stopScan();found(text);return;}setTimeout(loop,200);};loop();}
function stopScan(){scanning=false;$('scan').classList.remove('open');if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;}}
function found(text){
  // a label of another drawing: open that drawing
  if(/^https?:\/\//i.test(text)){const here=location.href.split('#')[0],there=text.split('#')[0];if(there&&there!==here&&!/^file:/i.test(location.href)){location.href=text;return;}}
  const r=lookup(text);if(!r.length){hint('Không thấy tấm của mã: '+text.slice(0,60),6000);$('q').value=keyFrom(text);openSheet('sh-find');renderList();return;}
  closeSheet('sh-find');select(r,{dim:true,focus:true,info:r.length===1});}
$('scan-open').addEventListener('click',startScan);$('scan-close').addEventListener('click',stopScan);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&scanning)stopScan();});

// ---------- start ----------
function fatal(msg){const e=document.getElementById('err');if(e){e.textContent=msg;e.style.display='flex';}const h=document.getElementById('hint');if(h)h.textContent='';}
$('company').textContent=H.company||'Bản vẽ lắp đặt 3D';
$('title').textContent=(H.title||H.model||'Bản vẽ')+(H.company?' · Bản vẽ 3D':'');
document.title=(H.title||H.model||'Bản vẽ')+' · Bản vẽ 3D';
{const b=sceneBox();if(b)sceneRadius=Math.max(200,Math.hypot(b[3]-b[0],b[4]-b[1],b[5]-b[2])/2);resize();fit(b);home=JSON.stringify(cam);}
refreshState();syncButtons();if(store.get('tools_min',false))foldTools(true);
function fromHash(){const m=(location.hash+'&'+location.search).match(/[#&?]p=([^&#]+)/);if(!m)return false;const r=lookup(decodeURIComponent(m[1]),true);
  if(r.length){select(r,{dim:true,focus:true,info:r.length===1});hint(r.length===1?'Tấm '+(parts[r[0]].id?'ID '+parts[r[0]].id+' · ':'')+(parts[r[0]].n||''):'',5000);}else hint('Không thấy tấm của mã QR này trong bản vẽ.',6000);return true;}
if(!fromHash())hint('1 ngón xoay · 2 ngón kéo / thu phóng · chạm để chọn tấm',4500);
window.addEventListener('hashchange',fromHash);
window.HPViewer={parts,select,lookup,act,cam,redraw,pick,state:S,fit,sceneBox,zoomAt,stateFlags:()=>Array.from({length:N},(_,i)=>stateTex[i*4]),stats:()=>({triangles:idx.length/3,edges:epid.length/2,frameGap,lowRes,canvas:[canvas.width,canvas.height]})};
}
requestAnimationFrame(()=>setTimeout(hpViewerMain,20));
</script>
